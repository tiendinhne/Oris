<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thẻ bài viết</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<article style="box-sizing: border-box; width: 100%; background: #FFFFFF; border: 1px solid #E4E7EF; border-radius: 16px; padding: 16px 20px 10px; display: flex; flex-direction: column; gap: 8px; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #0F172A">
<sc-if value="{{p.reposted}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 8px; padding-left: 52px; font-size: 13px; color: #64748B">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13l-3-3"></path><path d="M20 15H7l3 3"></path></svg>
{{p.repostedBy}} đã đăng lại
</div>
</sc-if>
<div style="display: flex; gap: 12px">
<a href="UserProfile.dc.html" aria-label="Hồ sơ của {{p.name}}" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: {{p.avBg}}; color: {{p.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">{{p.initials}}</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 36px">
<a href="UserProfile.dc.html" style="font-weight: 600; color: #0F172A; text-decoration: none">{{p.name}}</a>
<span style="color: #64748B; font-size: 14px">@{{p.user}}</span>
<sc-if value="{{p.private}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: #EEF0F6; color: #334155; font-size: 12px; font-weight: 500">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Riêng tư</span>
</sc-if>
<span style="margin-left: auto; display: flex; align-items: center; gap: 6px; color: #64748B; font-size: 14px">
<span>{{p.time}}</span>
<sc-if value="{{p.edited}}" hint-placeholder-val="{{false}}"><span>(đã chỉnh sửa)</span></sc-if>
</span>
<a href="MenuOther.dc.html" aria-label="Tùy chọn bài viết" style="width: 36px; height: 36px; margin-right: -8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #334155">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
</a>
</div>
<sc-if value="{{p.hasText}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; white-space: pre-line">{{p.text}}</p>
</sc-if>
<sc-if value="{{p.hasTag}}" hint-placeholder-val="{{true}}">
<a href="Hashtag.dc.html" style="align-self: flex-start; font-weight: 500; text-decoration: none; color: #4F46E5">#{{p.tag}}</a>
</sc-if>
<sc-if value="{{p.hasImages}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: {{p.gridCols}}; gap: 8px; max-width: {{p.gridMax}}">
<sc-for list="{{p.imgs}}" as="m" hint-placeholder-count="2">
<div role="img" aria-label="Ảnh đính kèm, khung 3:4" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #E8EAF3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #64748B; font-size: 13px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 17-5-5-9 8"></path></svg>
Ảnh 3:4
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{p.video}}" hint-placeholder-val="{{false}}">
<div style="position: relative; width: 240px; aspect-ratio: 3 / 4; border-radius: 12px; background: #15171B; display: flex; align-items: center; justify-content: center">
<button type="button" aria-label="Phát video" style="width: 56px; height: 56px; border: 0; border-radius: 50%; background: #FFFFFF; color: #15171B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
</button>
<span style="position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 6px; background: #000000; color: #FFFFFF; font-size: 12px">{{p.duration}}</span>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 2px; margin-left: -10px">
<button type="button" aria-label="Thích, {{p.likes}} lượt" aria-pressed="{{p.likePressed}}" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; background: transparent; border-radius: 20px; cursor: pointer; font: inherit; font-size: 14px; color: {{p.likeColor}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{p.heartFill}}" stroke="{{p.heartStroke}}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"></path></svg>
{{p.likes}}</button>
<sc-if value="{{p.canReply}}" hint-placeholder-val="{{true}}">
<a href="PostDetail.dc.html" aria-label="Trả lời, {{p.replies}} trả lời" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 20px; color: #334155; text-decoration: none; font-size: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9.5L5 20v-4H4z"></path></svg>
{{p.replies}}</a>
</sc-if>
<sc-if value="{{p.repliesOff}}" hint-placeholder-val="{{false}}">
<span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; color: #64748B; font-size: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9.5L5 20v-4H4z"></path><path d="M3 3l18 18"></path></svg>
Đã tắt trả lời</span>
</sc-if>
<button type="button" aria-label="Đăng lại, {{p.reposts}} lượt" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; background: transparent; border-radius: 20px; cursor: pointer; font: inherit; font-size: 14px; color: #334155">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13l-3-3"></path><path d="M20 15H7l3 3"></path></svg>
{{p.reposts}}</button>
</div>
</div>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":620,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = [['#E0E7FF', '#4338CA'], ['#FCE8EE', '#8E1F45'], ['#E0F2FE', '#075985'], ['#FFF0DC', '#7A4A00']];
    const it = this.props.item ?? {
      name: 'Lê Thu Hà', user: 'thuha.le', time: '12 phút',
      text: 'Sáng nay ghé quán mới mở ở Quận 3, cà phê muối đậm vị, chỗ ngồi yên tĩnh. Ai cần chỗ làm việc cuối tuần thì ghé thử nhé.',
      tag: 'caphe', likes: 48, replies: 9, reposts: 3, images: 2, tone: 1, liked: true
    };
    const words = it.name.trim().split(/\s+/);
    const t = tones[(it.tone || 0) % tones.length];
    const n = it.images || 0;
    return {
      p: Object.assign({}, it, {
        initials: (words[0][0] + (words.length > 1 ? words[words.length - 1][0] : '')).toUpperCase(),
        avBg: t[0], avFg: t[1],
        hasText: !!it.text, hasTag: !!it.tag,
        hasImages: n > 0,
        imgs: Array.from({ length: n }, (_, i) => ({ i: i })),
        gridCols: n > 1 ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1fr)',
        gridMax: n > 1 ? '100%' : '280px',
        video: !!it.video, duration: it.duration || '0:42',
        heartFill: it.liked ? '#C92A5B' : 'none',
        heartStroke: it.liked ? '#C92A5B' : 'currentColor',
        likeColor: it.liked ? '#B0234F' : '#334155',
        likePressed: it.liked ? 'true' : 'false',
        private: !!it.private, edited: !!it.edited,
        repliesOff: !!it.repliesOff, canReply: !it.repliesOff,
        reposted: !!it.repostedBy
      })
    };
  }
}
</script>
</body>
</html>
