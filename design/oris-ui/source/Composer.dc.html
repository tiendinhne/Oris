</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 20px; border-top: 1px solid #EEF0F6">

<option>Công khai</option><option>Riêng tư – chỉ mình tôi</option>
</select>
</div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
