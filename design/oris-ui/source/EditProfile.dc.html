<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chỉnh sửa hồ sơ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:#4F46E5}a:hover{color:#4338CA}
</style>
</helmet>
<div style="width: 760px; height: 900px; box-sizing: border-box; padding: 40px; background: #1E2235; display: flex; align-items: center; justify-content: center; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #0F172A">
<div role="dialog" aria-labelledby="edit-title" style="width: 560px; box-sizing: border-box; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="edit-title" style="margin: 0; font-size: 20px; font-weight: 600">Chỉnh sửa hồ sơ</h2>
<a href="Profile.dc.html" aria-label="Đóng" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #334155">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<span aria-hidden="true" style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 50%; background: #E0E7FF; color: #4338CA; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600">NA</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 8px">
<button type="button" style="height: 38px; padding: 0 14px; border: 1px solid #CBD2E1; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #0F172A; cursor: pointer">Đổi ảnh</button>
<button type="button" style="height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #B91C1C; cursor: pointer">Gỡ ảnh</button>
</div>
<span style="font-size: 13px; color: #64748B">JPG hoặc PNG, tối đa 5MB. Ảnh sẽ được cắt vuông.</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><label for="display-name" style="font-size: 14px; font-weight: 500; color: #334155">Tên hiển thị</label><span style="font-size: 13px; color: #64748B">15/50</span></div>
<input id="display-name" type="text" value="Nguyễn Minh Anh" style="height: 46px; padding: 0 14px; border: 1px solid #CBD2E1; border-radius: 10px; font: inherit; color: #0F172A">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="username" style="font-size: 14px; font-weight: 500; color: #334155">Username</label>
<div style="display: flex; align-items: center; height: 46px; padding: 0 14px; border: 1px solid #CBD2E1; border-radius: 10px">
<span aria-hidden="true" style="color: #64748B">@</span>
<input id="username" type="text" value="minhanh.ng" aria-describedby="username-note" style="flex-grow: 1; height: 100%; border: 0; padding: 0 2px; font: inherit; color: #0F172A; background: transparent">
</div>
<span id="username-note" style="font-size: 13px; color: #64748B">Đổi được 1 lần mỗi 30 ngày. Username cũ sẽ được người khác dùng được ngay.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><label for="bio" style="font-size: 14px; font-weight: 500; color: #334155">Tiểu sử</label><span style="font-size: 13px; color: #64748B">64/150</span></div>
<textarea id="bio" rows="3" style="padding: 10px 14px; border: 1px solid #CBD2E1; border-radius: 10px; font: inherit; resize: vertical; color: #0F172A">Thiết kế giao diện ở Sài Gòn. Thích cà phê và chạy bộ buổi sáng.</textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="link" style="font-size: 14px; font-weight: 500; color: #334155">Liên kết <span style="font-weight: 400; color: #64748B">(không bắt buộc)</span></label>
<input id="link" type="url" placeholder="https://" style="height: 46px; padding: 0 14px; border: 1px solid #CBD2E1; border-radius: 10px; font: inherit; color: #0F172A">
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px">
<a href="Profile.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #CBD2E1; color: #0F172A; font-weight: 600; text-decoration: none; box-sizing: border-box">Hủy</a>
<a href="Profile.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 22px; background: #4F46E5; color: #FFFFFF; font-weight: 600; text-decoration: none">Lưu thay đổi</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
