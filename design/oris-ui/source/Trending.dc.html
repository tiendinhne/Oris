<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hashtag thịnh hành</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside aria-labelledby="trend-title" style="width: 300px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E4E7EF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 6px; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #0F172A; font-size: 15px; line-height: 1.45">
<h2 id="trend-title" style="margin: 0; font-size: 17px; font-weight: 600">Hashtag thịnh hành</h2>
<p style="margin: 0 0 6px; font-size: 13px; color: #64748B">Theo số bài viết trong 24 giờ qua</p>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<li style="border-top: 1px solid #EEF0F6">
<a href="Hashtag.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; text-decoration: none; color: #0F172A">
<span style="width: 18px; color: #64748B; font-size: 14px; font-variant-numeric: tabular-nums">{{t.rank}}</span>
<span style="display: flex; flex-direction: column">
<span style="font-weight: 600">#{{t.tag}}</span>
<span style="font-size: 13px; color: #64748B">{{t.count}} bài</span>
</span>
</a>
</li>
</sc-for>
</ol>
<a href="Search.dc.html" style="margin-top: 6px; font-size: 14px; font-weight: 500; color: #4F46E5">Xem đủ 10 hashtag</a>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [['caphe', 214], ['saigonmua', 187], ['docsach', 142], ['chaybobuoisang', 118], ['nauanmoingay', 96], ['nhiepanhphim', 74]];
    return { tags: raw.map((r, i) => ({ rank: i + 1, tag: r[0], count: r[1] })) };
  }
}
</script>
</body>
</html>
