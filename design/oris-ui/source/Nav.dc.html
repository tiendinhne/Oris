<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","search","notifications","profile","settings","explore","none"],"default":"home"},"guest":{"editor":"boolean","default":false},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const guest = this.props.guest === true || this.props.guest === 'true';
    const on = (k) => ({
      bg: a === k ? '#E0E7FF' : 'transparent',
      fg: a === k ? '#4338CA' : '#334155',
      fw: a === k ? '600' : '500',
      cur: a === k ? 'page' : 'false'
    });
    return {
      guest: guest, member: !guest,
      home: on('home'), search: on('search'), notifications: on('notifications'),
      profile: on('profile'), settings: on('settings'), explore: on('explore')
    };
  }
}
</script>
