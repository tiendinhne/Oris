<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Người theo dõi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:#4F46E5}a:hover{color:#4338CA}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; width: 100%; min-height: 900px; background: #F4F5FA; color: #0F172A; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<dc-import name="Nav" active="profile" hint-size="248px,900px"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 24px 64px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 32px">
<div style="flex: 1 1 520px; max-width: 620px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px">
<a href="Profile.dc.html" aria-label="Quay lại hồ sơ" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0F172A">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="display: flex; flex-direction: column; line-height: 1.3">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">Nguyễn Minh Anh</h1>
<span style="font-size: 14px; color: #64748B">@minhanh.ng</span>
</div>
</div>
<nav aria-label="Danh sách theo dõi" style="display: flex; gap: 4px; padding: 4px; background: #FFFFFF; border: 1px solid #E4E7EF; border-radius: 14px">
<a href="FollowList.dc.html" aria-current="page" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 10px; background: #4F46E5; color: #FFFFFF; font-weight: 600; text-decoration: none">Người theo dõi <span style="font-weight: 500">1.204</span></a>
<a href="FollowList.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 10px; color: #334155; font-weight: 500; text-decoration: none">Đang theo dõi <span>312</span></a>
</nav>
<ul style="list-style: none; margin: 0; padding: 4px 20px; background: #FFFFFF; border: 1px solid #E4E7EF; border-radius: 16px">
<sc-for list="{{people}}" as="u" hint-placeholder-count="7">
<li style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: {{u.line}}">
<a href="UserProfile.dc.html" aria-hidden="true" tabindex="-1" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: {{u.avBg}}; color: {{u.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">{{u.initials}}</a>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35">
<a href="UserProfile.dc.html" style="font-weight: 600; color: #0F172A; text-decoration: none">{{u.name}}</a>
<span style="font-size: 14px; color: #64748B">@{{u.user}}</span>
<span style="font-size: 14px; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{u.bio}}</span>
</div>
<sc-if value="{{u.followBack}}" hint-placeholder-val="{{true}}">
<button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #4F46E5; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap">Theo dõi lại</button>
</sc-if>
<sc-if value="{{u.following}}" hint-placeholder-val="{{false}}">
<button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #CBD2E1; border-radius: 10px; background: #FFFFFF; color: #0F172A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap">Đang theo dõi</button>
</sc-if>
</li>
</sc-for>
</ul>
</div>
<dc-import name="Trending" hint-size="300px,520px"></dc-import>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = [['#E0E7FF', '#4338CA'], ['#FCE8EE', '#8E1F45'], ['#E0F2FE', '#075985'], ['#FFF0DC', '#7A4A00']];
    const raw = [
      ['Lê Thu Hà', 'thuha.le', 'Viết về đồ ăn và những quán cà phê nhỏ ở Sài Gòn.', true],
      ['Bùi Đức Thịnh', 'thinh.bd', 'Đọc sách, chạy bộ, thỉnh thoảng viết.', true],
      ['Hoàng Mai', 'maihoang_', 'Chạy bộ mỗi sáng ở công viên Gia Định.', false],
      ['Phạm Gia Huy', 'giahuy', 'Học tiếng Anh mỗi ngày một ít.', false],
      ['Võ Ngọc Lan', 'lan.vo', 'Chụp ảnh đường phố bằng điện thoại.', true],
      ['Trần Thủy Trang', 'thuytrang', 'Giáo viên tiểu học, mê làm bánh.', false],
      ['Đặng Tuấn Kiệt', 'kiet.dang', 'Máy ảnh phim và những chuyến đi xa.', true]
    ];
    return {
      people: raw.map((r, i) => {
        const w = r[0].split(/\s+/);
        const t = tones[i % tones.length];
        return { name: r[0], user: r[1], bio: r[2], following: r[3], followBack: !r[3],
          initials: (w[0][0] + w[w.length - 1][0]).toUpperCase(), avBg: t[0], avFg: t[1],
          line: i === 0 ? '0' : '1px solid #EEF0F6' };
      })
    };
  }
}
</script>
</body>
</html>
