services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"   # mở ra để xem DB bằng DBeaver/pgAdmin khi phát triển
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+asyncpg://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./auth-service:/app   # sửa code là tự nạp lại
    # tự chạy migration rồi mới khởi động service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  post-service:
    build: ./post-service
    environment:
      SERVICE_NAME: post-service
      DATABASE_URL: postgresql+asyncpg://post_user:${POST_DB_PASSWORD}@postgres:5432/post_db
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./post-service:/app
    # tự chạy migration rồi mới khởi động service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  admin-web:
    image: node:20-alpine
    working_dir: /app
    environment:
      AUTH_URL: http://auth-service:8000   # Vite chuyển tiếp /api/auth/... sang đây
      POST_URL: http://post-service:8000
    volumes:
      - ./admin-web:/app
      - /app/node_modules                  # giữ node_modules trong container
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - auth-service
      - post-service
    ports:
      - "5173:5173"

volumes:
  pgdata:
