services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"   # mở ra để xem DB bằng DBeaver/pgAdmin khi phát triển
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+asyncpg://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MOCK_OTP: ${MOCK_OTP-1234}          # TẠM THỜI: mọi mã OTP là 1234. Đặt MOCK_OTP= (trống) trong .env để sinh mã thật
      SMTP_HOST: ${SMTP_HOST:-}           # bỏ trống = không gửi mail thật, mã xác minh nằm trong log
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./auth-service:/app   # sửa code là tự nạp lại
    # tự chạy migration rồi mới khởi động service
    command: sh -c "alembic upgrade head && python -m app.create_admin && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  post-service:
    build: ./post-service
    environment:
      SERVICE_NAME: post-service
      DATABASE_URL: postgresql+asyncpg://post_user:${POST_DB_PASSWORD}@postgres:5432/post_db
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./post-service:/app
    # tự chạy migration rồi mới khởi động service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: postgres://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      TSC_WATCHFILE: DynamicPriorityPolling   # Docker trên Windows không báo sự kiện đổi file
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:3000"
    volumes:
      - ./notification-service:/app   # sửa code là tự biên dịch lại
      - /app/node_modules             # giữ node_modules đã cài trong image

  feed-service:
    build: ./feed-service
    environment:
      DATABASE_URL: postgres://feed_user:${FEED_DB_PASSWORD}@postgres:5432/feed_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POST_SERVICE_URL: http://post-service:8000
      TSC_WATCHFILE: DynamicPriorityPolling
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:3000"
    volumes:
      - ./feed-service:/app
      - /app/node_modules

  search-service:
    build: ./search-service
    environment:
      SERVICE_NAME: search-service
      DATABASE_URL: postgresql+asyncpg://search_user:${SEARCH_DB_PASSWORD}@postgres:5432/search_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POST_SERVICE_URL: http://post-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"
    volumes:
      - ./search-service:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  user-web:
    build: ./user-web
    environment:
      AUTH_URL: http://auth-service:8000   # Vite chuyển tiếp /api/<service>/... sang từng service
      POST_URL: http://post-service:8000
      NOTIFICATION_URL: http://notification-service:3000
      FEED_URL: http://feed-service:3000
      SEARCH_URL: http://search-service:8000
    volumes:
      - ./user-web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - auth-service
      - post-service
      - notification-service
      - feed-service
      - search-service
    ports:
      - "5174:5174"

  admin-web:
    build: ./admin-web
    environment:
      AUTH_URL: http://auth-service:8000   # Vite chuyển tiếp /api/auth/... sang đây
      POST_URL: http://post-service:8000
    volumes:
      - ./admin-web:/app
      - /app/node_modules                  # giữ node_modules trong container
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - auth-service
      - post-service
    ports:
      - "5173:5173"

volumes:
  pgdata:
